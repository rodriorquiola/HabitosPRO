services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: habitopro
      POSTGRES_PASSWORD: habitopro
      POSTGRES_DB: habitopro
    ports:
      - "5440:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://habitopro:habitopro@db:5432/habitopro
    ports:
      - "8100:8000"
    depends_on:
      - db
    volumes:
      - ./backend:/app

volumes:
  db_data:
